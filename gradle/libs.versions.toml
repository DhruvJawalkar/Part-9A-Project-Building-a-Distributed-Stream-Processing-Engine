# Dependency versions for the whole build.
# Entries are added phase by phase, so this file doubles as a record of what each
# phase actually needed. Phase 1 needs a Kafka client, a logging backend and a test stack.

[versions]
junit    = "5.11.4"
assertj  = "3.26.3"
slf4j    = "2.0.16"
logback  = "1.5.12"
kafka    = "3.9.0"
jackson  = "2.18.2"
grpc     = "1.84.0"
protobuf = "4.36.1"
jetcd    = "0.8.7"
protobufPlugin = "0.10.0"
# 1.21.4 raises docker-java's default API level so Testcontainers works with modern Docker
# engines that no longer accept the 1.32 API used by 1.20.x.
testcontainers = "1.21.4"
awaitility = "4.3.0"
rocksdb = "9.10.0"
minio = "8.5.17"
iceberg = "1.11.0"
hadoop = "3.3.6"
parquet = "1.17.1"
micrometer = "1.12.13"

[libraries]
junit-bom      = { module = "org.junit:junit-bom",                version.ref = "junit" }
junit-jupiter  = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj        = { module = "org.assertj:assertj-core",           version.ref = "assertj" }
slf4j-api      = { module = "org.slf4j:slf4j-api",                version.ref = "slf4j" }
logback        = { module = "ch.qos.logback:logback-classic",     version.ref = "logback" }
kafka-clients  = { module = "org.apache.kafka:kafka-clients",     version.ref = "kafka" }
jackson        = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# gRPC and protobuf. Phase 2 moves records and control messages between processes.
grpc-protobuf      = { module = "io.grpc:grpc-protobuf",      version.ref = "grpc" }
grpc-stub          = { module = "io.grpc:grpc-stub",          version.ref = "grpc" }
grpc-netty-shaded  = { module = "io.grpc:grpc-netty-shaded",  version.ref = "grpc" }
grpc-services      = { module = "io.grpc:grpc-services",      version.ref = "grpc" }
protobuf-java      = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
# javax.annotation.Generated, which protoc-gen-grpc-java emits references to.
annotations-api    = { module = "org.apache.tomcat:annotations-api", version = "6.0.53" }

# etcd: durable home for the job graph, task assignments and checkpoint pointers.
jetcd              = { module = "io.etcd:jetcd-core",         version.ref = "jetcd" }

testcontainers     = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka",  version.ref = "testcontainers" }
# Polling with a deadline, for tests of things that become true rather than are true.
awaitility         = { module = "org.awaitility:awaitility",   version.ref = "awaitility" }

# Phase 4: an embedded LSM keeps keyed state off the Java heap and provides atomic local
# checkpoints. The runtime deliberately exposes it only behind StateBackend.
rocksdb-jni        = { module = "org.rocksdb:rocksdbjni",       version.ref = "rocksdb" }
# Phase 4: durable, worker-independent checkpoint archives. MinIO exposes the S3 API used by
# the local compose environment as well as production-compatible object stores.
minio              = { module = "io.minio:minio",                version.ref = "minio" }

# Phase 6: immutable Parquet files become visible through one atomic Iceberg metadata commit.
iceberg-core        = { module = "org.apache.iceberg:iceberg-core", version.ref = "iceberg" }
iceberg-parquet     = { module = "org.apache.iceberg:iceberg-parquet", version.ref = "iceberg" }
iceberg-aws         = { module = "org.apache.iceberg:iceberg-aws", version.ref = "iceberg" }
iceberg-aws-bundle  = { module = "org.apache.iceberg:iceberg-aws-bundle", version.ref = "iceberg" }
hadoop-common       = { module = "org.apache.hadoop:hadoop-common", version.ref = "hadoop" }
hadoop-mapreduce-client-core = { module = "org.apache.hadoop:hadoop-mapreduce-client-core", version.ref = "hadoop" }
parquet-avro        = { module = "org.apache.parquet:parquet-avro", version.ref = "parquet" }

# Phase 7: Micrometer owns Prometheus' text exposition format and metric naming rules.
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
