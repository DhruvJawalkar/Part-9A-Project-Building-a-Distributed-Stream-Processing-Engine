org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# MACHINE-LOCAL: which JDK *launches* Gradle (distinct from the Java 21
# toolchain the build compiles against, which is set in build.gradle.kts).
#
# Gradle 8.14 supports launching on JDK 17-24. This machine's JAVA_HOME points
# at JDK 26, which Gradle refuses with a bare "26.0.2" error message. Pinning
# it here means ./gradlew works without exporting JAVA_HOME first.
#
# Delete this line if you are running elsewhere with a supported JAVA_HOME.
# ---------------------------------------------------------------------------
org.gradle.java.home=C:/Users/dhruv/.jdks/ms-21.0.9
