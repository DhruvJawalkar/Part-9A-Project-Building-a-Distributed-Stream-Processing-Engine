# Local environment for the stream processing engine.
#
# Phase 1 needs a Kafka broker and nothing else. This file grows one service at a time as the
# phases need them -- etcd in Phase 2, MinIO and the Iceberg REST catalog in Phase 4 and 6,
# Prometheus and Grafana in Phase 7 -- so that at any point it contains exactly what the engine
# currently uses and no more.
#
#   docker compose up -d        start the broker and create the topics
#   docker compose down -v      stop it and discard all data
#
# Topics are created with 4 partitions deliberately. One partition would hide every
# partition-shaped problem the engine exists to demonstrate: per-partition watermarks, idle
# partitions stalling the event-time clock, and skew across parallel subtasks.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: lms-kafka
    ports:
      # 9092 is for clients on the host, which is how the engine connects while it still runs
      # outside Docker. Phase 2 adds master and worker containers, which use kafka:19092.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: lms-stream-engine-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Creates the two topics and exits. Separate from the broker so that topic configuration is
  # declared here rather than left to auto-creation, which would silently give every topic one
  # partition.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: lms-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in lms.catalog.clicks lms.catalog.borrows; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 4 --replication-factor 1
        done
        echo "topics ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

  # Metadata store for the master: job graphs, assignments, job state, and from Phase 4 the
  # latest checkpoint pointer. Also the worker registry -- workers register under a TTL lease,
  # so a crashed one disappears on its own and the master learns of it by watching the prefix.
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: lms-etcd
    ports:
      - "2379:2379"
    environment:
      ETCD_NAME: etcd-1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: lms-stream-engine
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One object per task checkpoint. Workers stage a local RocksDB/source snapshot, ZIP the whole
  # directory, and put that archive here before they acknowledge the checkpoint to the master.
  # Keeping the archive outside the worker filesystem makes a restore portable to any worker.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lms-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  # Creates the buckets used by checkpoint archives and the Iceberg warehouse. Keeping this as
  # a one-shot service makes `docker compose down -v` a complete reset while allowing the REST
  # catalog and workers to use stable bucket names on every run.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: lms-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          sleep 1
        done
        mc mb --ignore-existing local/stream-checkpoints
        mc mb --ignore-existing local/warehouse
        echo "MinIO buckets ready: stream-checkpoints warehouse"

  # Metadata JSON/Parquet lives in MinIO; the catalog's SQLite pointer database has its own
  # volume so a normal Compose down/up does not lose tables while retaining their objects.
  iceberg-rest:
    # Pin the REST fixture tested with this repository's REST client.
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: lms-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      CATALOG_URI: jdbc:sqlite:/tmp/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - iceberg-catalog-data:/tmp

  # Create the LMS namespace and tables before submitting the fixture job. These REST calls are
  # idempotent: 409 means the object already exists and is therefore success for this bootstrap.
  iceberg-init:
    image: curlimages/curl:8.12.1
    container_name: lms-iceberg-init
    depends_on:
      iceberg-rest:
        condition: service_started
    volumes:
      - ./demos/iceberg:/schema:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until curl -fsS http://iceberg-rest:8181/v1/config >/dev/null; do sleep 1; done
        post() {
          code="$$(curl -sS -o /tmp/response -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data-binary "@$$2" "$$1")"
          case "$$code" in 2??|409) ;; *) cat /tmp/response; exit 1 ;; esac
        }
        post http://iceberg-rest:8181/v1/namespaces /schema/namespace.json
        post http://iceberg-rest:8181/v1/namespaces/lms%1Fanalytics/tables /schema/browse_sessions.table.json
        post http://iceberg-rest:8181/v1/namespaces/lms%1Fanalytics/tables /schema/click_conversions.table.json
        echo "Iceberg schema ready"

  master:
    build:
      context: .
      target: runtime
    image: lms-stream-engine:phase7
    container_name: lms-master
    command: ["/opt/engine/engine-entrypoint.sh", "master"]
    depends_on:
      etcd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${MASTER_STATUS_HOST_PORT:-18080}:8080"
    environment:
      MASTER_PORT: 9090
      MASTER_STATUS_PORT: 8080
      ETCD_ENDPOINTS: http://etcd:2379
      CHECKPOINT_INTERVAL_MS: 10000
      CHECKPOINT_TIMEOUT_MS: 30000
      RESTART_MAX_ATTEMPTS: 3
      RESTART_DELAY_MS: 1000
    restart: unless-stopped

  worker1:
    image: lms-stream-engine:phase7
    container_name: lms-worker-1
    command: ["/opt/engine/engine-entrypoint.sh", "worker"]
    depends_on:
      master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${WORKER1_METRICS_HOST_PORT:-18081}:8081"
    environment: &worker-environment
      WORKER_ID: worker-1
      WORKER_HOST: worker1
      WORKER_RPC_PORT: 9091
      WORKER_DATA_PORT: 9191
      WORKER_METRICS_PORT: 8081
      WORKER_SLOTS: 12
      MASTER_HOST: master
      MASTER_PORT: 9090
      ETCD_ENDPOINTS: http://etcd:2379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: stream-checkpoints
    restart: unless-stopped

  worker2:
    image: lms-stream-engine:phase7
    container_name: lms-worker-2
    command: ["/opt/engine/engine-entrypoint.sh", "worker"]
    depends_on:
      master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${WORKER2_METRICS_HOST_PORT:-18082}:8081"
    environment:
      <<: *worker-environment
      WORKER_ID: worker-2
      WORKER_HOST: worker2
    restart: unless-stopped

  worker3:
    image: lms-stream-engine:phase7
    container_name: lms-worker-3
    command: ["/opt/engine/engine-entrypoint.sh", "worker"]
    depends_on:
      master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${WORKER3_METRICS_HOST_PORT:-18083}:8081"
    environment:
      <<: *worker-environment
      WORKER_ID: worker-3
      WORKER_HOST: worker3
    restart: unless-stopped

  # The submitter waits for all three workers through the master's existing submission contract.
  # It then exits successfully; seed-fixtures publishes only after that happens.
  seed-job:
    image: lms-stream-engine:phase7
    container_name: lms-seed-job
    depends_on:
      worker1:
        condition: service_started
      worker2:
        condition: service_started
      worker3:
        condition: service_started
      iceberg-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        attempt=0
        until java -cp '/opt/engine/submit/classes:/opt/engine/master/lib/*:/opt/engine/lms/lib/*' \
          dev.dhruv.streaming.lms.SubmitLmsJob; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then exit 1; fi
          echo "master not ready; retrying job submission ($$attempt/30)"
          sleep 2
        done
    environment:
      MASTER_HOST: master
      MASTER_PORT: 9090
      MIN_WORKERS: 3
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://warehouse/
      ICEBERG_S3_ENDPOINT: http://minio:9000
      ICEBERG_S3_ACCESS_KEY: minioadmin
      ICEBERG_S3_SECRET_KEY: minioadmin
      ICEBERG_S3_REGION: us-east-1
    restart: "no"

  seed-fixtures:
    image: apache/kafka:3.9.0
    container_name: lms-seed-fixtures
    depends_on:
      seed-job:
        condition: service_completed_successfully
    volumes:
      - ./demos/fixtures:/fixtures:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Every partition receives a progress record. Silence alone cannot advance event time
        # and close the 15-minute sessions in this short replay. Round-robin is only fixture
        # publication; the engine still uses the graph's keyed exchange for aggregation.
        cat /fixtures/clicks.jsonl /fixtures/click-watermark-progress.jsonl | \
          /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:19092 \
          --producer-property partitioner.class=org.apache.kafka.clients.producer.RoundRobinPartitioner \
          --producer-property acks=all --topic lms.catalog.clicks
        cat /fixtures/borrows.jsonl /fixtures/borrow-watermark-progress.jsonl | \
          /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:19092 \
          --producer-property partitioner.class=org.apache.kafka.clients.producer.RoundRobinPartitioner \
          --producer-property acks=all --topic lms.catalog.borrows
        echo "deterministic click and borrow fixtures published"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lms-prometheus
    ports:
      - "9090:9090"
    depends_on:
      master:
        condition: service_started
      worker1:
        condition: service_started
      worker2:
        condition: service_started
      worker3:
        condition: service_started
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lms-grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  kafka-data:
  etcd-data:
  minio-data:
  prometheus-data:
  grafana-data:
  iceberg-catalog-data:
