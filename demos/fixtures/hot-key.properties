# Demo 4 workload specification. The generator is deterministic; keeping the dimensions here
# makes the skew proof reproducible without checking in sixteen thousand near-identical lines.
member=member-hot
events=16000
salt.buckets=16
subtasks=4
per.subtask.capacity=5000
# The property above is retained for the small hash-routing regression only. Demo 4 observes
# actual bounded runtime queues; it never treats a record-count threshold as backpressure.
source.record.delay.micros=4000
session.record.work.micros=2000
